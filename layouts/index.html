<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Site.Title }}</title>
    <style>
      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        background: linear-gradient(135deg, #f7f3ea, #dbe7f0);
        color: #1d2a34;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      .card {
        max-width: 680px;
        width: 100%;
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(29, 42, 52, 0.2);
        border-radius: 12px;
        padding: 2rem;
        box-shadow: 0 10px 30px rgba(29, 42, 52, 0.12);
      }
      h1 {
        margin-top: 0;
        margin-bottom: 0.75rem;
      }
      p {
        line-height: 1.6;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <h1>{{ .Site.Title }}</h1>
        <p>This is a barebones Hugo site deployed from the main branch to GitHub Pages.</p>
      </section>
    </main>
  </body>
</html>
